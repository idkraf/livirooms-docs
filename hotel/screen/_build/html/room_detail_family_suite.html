<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=390,height=844">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{width:390px;height:844px}
  body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:#1A1A2E;overflow:hidden}
  .screen{width:390px;height:844px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:#fff}
  .statusbar{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:13px;font-weight:700;flex:0 0 auto;z-index:30;color:#1A1A2E}
  .body{flex:1 1 auto;overflow:hidden;position:relative;display:flex;flex-direction:column}
  .scroll{flex:1;overflow:hidden}
  .btn{height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;border:none;width:100%;cursor:pointer}
  .btn-primary{background:#2962FF;color:#fff}
  .btn-outline{background:transparent;border:1.5px solid #2962FF;color:#2962FF}
  .divider{height:1px;background:#EEEEEE;margin:0}
  .muted{color:#757575}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid #E0E0E0}
  </style></head>
<body>undefined</body></html>

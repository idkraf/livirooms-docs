<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=390,height=844">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{width:390px;height:844px}

  .screen{width:390px;height:844px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:#fff}

  .divider{height:1px;background:#EEEEEE;margin:0}
  .muted{color:#757575}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid #E0E0E0}
